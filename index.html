<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SF Skyline</title>
  <style>
    :root {
      --bg: #f4f6f9; --text: #1b2330; --muted: #637083; --accent: #2f6fdb;
      --footer-bg: #1b2330; --footer-text: #e6ebf2; --footer-muted: #93a0b3;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11151c; --text: #e6ebf2; --muted: #93a0b3; --accent: #7aa7ff;
        --footer-bg: #0b0e13; --footer-text: #e6ebf2; --footer-muted: #93a0b3;
      }
    }
    * { box-sizing: border-box; }
    /* Snap between "scene" and "footer open" so the footer behaves like a drawer */
    html { scroll-snap-type: y mandatory; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* Scene: exactly one full viewport */
    .scene {
      height: 100vh;
      height: 100dvh;
      scroll-snap-align: start;
      display: flex; flex-direction: column; align-items: center;
      padding: 22vh 16px 24px; text-align: center;
      /* Sketch fills the scene; anchored to the bottom so the skyline is never cropped */
      /* --sky-top / --sky-horizon are set to a random blue by the script below */
      background:
        url("assets/skyline_rough_sketch.png") center bottom / cover no-repeat,
        linear-gradient(to bottom, var(--sky-top, #4a90d9), var(--sky-horizon, #a9d2f5));
    }
    .time { font-size: clamp(3rem, 12vw, 7rem); font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; }
    .date { font-size: clamp(1rem, 3vw, 1.5rem); color: var(--muted); margin-top: 12px; }

    /* Footer drawer: 25% of the viewport, revealed by scrolling down */
    .drawer {
      height: 25vh;
      height: 25dvh;
      scroll-snap-align: end;
      background: var(--footer-bg);
      color: var(--footer-text);
      display: flex; flex-direction: column; justify-content: center; gap: 8px;
      padding: 16px clamp(16px, 5vw, 48px);
      font-size: 0.9rem;
    }
    .drawer h2 { margin: 0; font-size: 1rem; }
    .drawer p { margin: 0; color: var(--footer-muted); }
    .drawer a { color: var(--footer-text); }
  </style>
  <link rel="stylesheet" href="nav.css" />
</head>
<body>
  <nav class="page-toggle">
    <a href="index.html" aria-current="page">Dashboard</a>
    <a href="stats.html">All stats</a>
  </nav>
  <main class="scene">
    <div class="time" id="time">—</div>
    <div class="date" id="date">—</div>
  </main>

  <footer class="drawer">
    <p>Footer text</p>
  </footer>

<script>
  const TZ = "America/Los_Angeles";

  // Placeholder sky: a random blue each load (to be replaced by the sun-driven gradient, PRD S1)
  const hue = 195 + Math.random() * 20;      // 195–215: cyan-blue to true blue
  const sat = 55 + Math.random() * 25;       // 55–80%
  const light = 65 + Math.random() * 10;     // 65–75%
  const sky = document.documentElement.style;
  sky.setProperty("--sky-top", `hsl(${hue} ${sat}% ${light}%)`);
  sky.setProperty("--sky-horizon", `hsl(${hue} ${sat - 10}% ${Math.min(light + 18, 92)}%)`);
  function tick() {
    const now = new Date();
    document.getElementById("time").textContent =
      now.toLocaleTimeString("en-US", { timeZone: TZ, hour: "numeric", minute: "2-digit" });
    document.getElementById("date").textContent =
      now.toLocaleDateString("en-US", { timeZone: TZ, weekday: "long", month: "long", day: "numeric", year: "numeric" });
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
